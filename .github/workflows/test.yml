name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Every CI run is a cold run: nothing is cached between jobs, so Vitest
      # transforms and imports the whole tree before the first test body executes.
      # That is why vitest.config.ts raises testTimeout well above the 5s default.
      - run: npm test
